<div class="auth-page">
  <div class="auth-shell">
    <div class="auth-highlight">
      <h1 class="billboard-phrase">Site de Anúncios <em class="brand-name">Super-Unidos</em></h1>
      <p class="billboard-phrase">Um site diferenciado</p>
      <p class="billboard-phrase">Sinceridade é tudo</p>
      <p class="billboard-phrase">Unidos, Crescemos</p>
    </div>

    <div class="auth-card">
      <div class="card-body">
        <h5 class="card-title">Redefinir senha</h5>

        <div class="form-group" *ngIf="!token">
          <label for="email">E-mail cadastrado</label>
          <input id="email" type="email" class="form-control" [(ngModel)]="email" placeholder="Digite seu e-mail" autocomplete="email" required>
        </div>

        <div class="form-group mt-2" *ngIf="!token">
          <button type="button" class="btn btn-secondary btn-block" [disabled]="requestLoading" (click)="requestToken()">
            {{ requestLoading ? 'Gerando...' : 'Solicitar redefinição' }}
          </button>
        </div>

        <ng-container *ngIf="token">
          <div class="form-group">
            <label for="novaSenha">Nova senha</label>
            <input id="novaSenha" type="password" class="form-control" [(ngModel)]="novaSenha" placeholder="Digite sua nova senha" autocomplete="new-password" required>
          </div>

          <div class="form-group">
            <label for="confirmacaoSenha">Confirmar senha</label>
            <input id="confirmacaoSenha" type="password" class="form-control" [(ngModel)]="confirmacaoSenha" placeholder="Confirme sua nova senha" autocomplete="new-password" required>
          </div>

          <div class="form-group mt-3">
            <button type="button" class="btn btn-primary btn-block" [disabled]="resetLoading" (click)="submit()">
              {{ resetLoading ? 'Salvando...' : 'Salvar nova senha' }}
            </button>
          </div>
        </ng-container>

        <div class="status-message text-center mt-2" aria-live="polite" [class.error-msg]="!success && message" [class.success-msg]="success">
          {{ message }}
        </div>

        <p class="mt-3 text-center"><a [routerLink]="['/login']">Voltar para login</a></p>
      </div>
    </div>
  </div>
</div>
