<div class="auth-page">
  <div class="auth-shell">
    <div class="auth-highlight">
      <span class="auth-pill">Segurança</span>
      <h1>Redefinir senha</h1>
      <p>Crie uma nova senha para continuar acessando sua conta com segurança.</p>
      <ul class="feature-list">
        <li>Token de validação válido por 30 minutos</li>
        <li>Senha armazenada com criptografia</li>
        <li>Fluxo simples e seguro</li>
      </ul>
    </div>

    <div class="auth-card">
      <div class="card-body">
        <h5 class="card-title">Redefinir senha</h5>

        <div class="form-group">
          <label for="email">E-mail cadastrado</label>
          <input id="email" type="email" class="form-control" [(ngModel)]="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="form-group mt-2">
          <button type="button" class="btn btn-secondary btn-block" [disabled]="loading" (click)="requestToken()">
            {{ loading ? 'Gerando...' : 'Solicitar redefinição' }}
          </button>
        </div>

        <div class="form-group">
          <label for="token">Token de redefinição</label>
          <input id="token" type="text" class="form-control" [(ngModel)]="token" placeholder="Cole o token recebido" required>
        </div>

        <div class="form-group">
          <label for="novaSenha">Nova senha</label>
          <input id="novaSenha" type="password" class="form-control" [(ngModel)]="novaSenha" placeholder="Digite sua nova senha" required>
        </div>

        <div class="form-group">
          <label for="confirmacaoSenha">Confirmar senha</label>
          <input id="confirmacaoSenha" type="password" class="form-control" [(ngModel)]="confirmacaoSenha" placeholder="Confirme sua nova senha" required>
        </div>

        <div class="form-group mt-3">
          <button type="button" class="btn btn-primary btn-block" [disabled]="loading" (click)="submit()">
            {{ loading ? 'Salvando...' : 'Salvar nova senha' }}
          </button>
          <div class="status-message text-center mt-2" [class.error-msg]="!success && message" [class.success-msg]="success">
            {{ message }}
          </div>
        </div>

        <p class="mt-3 text-center"><a [routerLink]="['/login']">Voltar para login</a></p>
      </div>
    </div>
  </div>
</div>
