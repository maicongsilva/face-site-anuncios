<section class="home-hero">
  <div class="hero-copy">
    <!-- Coluna da Esquerda: Letreiro em destaque com as 4 frases -->
    <div class="hero-billboard">
      <h1 class="billboard-phrase">Site de Anúncios <em class="brand-name">Super-Unidos</em></h1>
      <p class="billboard-phrase">Um site diferenciado</p>
      <p class="billboard-phrase">Sinceridade é tudo</p>
      <p class="billboard-phrase">Unidos, Crescemos</p>
    </div>

    <!-- Coluna da Direita: Botões de ação grandes e de fácil destaque -->
    <div class="hero-actions-panel">
      <a class="hero-big-btn primary" [routerLink]="['/register']">
        <mat-icon class="btn-icon">person_add</mat-icon>
        <span>Criar conta</span>
      </a>
      <a class="hero-big-btn secondary" [routerLink]="['/login']">
        <mat-icon class="btn-icon">login</mat-icon>
        <span>Já tenho login</span>
      </a>
    </div>
  </div>
</section>

<app-anuncio-list></app-anuncio-list>
