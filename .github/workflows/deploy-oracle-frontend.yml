name: Deploy Frontend to Oracle VM

on:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-oracle-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production
        run: npm run build -- --configuration production

      - name: Prepare SSH key
        run: |
          printf '%s\n' "${{ secrets.OCI_SSH_KEY }}" > "$RUNNER_TEMP/oci_deploy_key"
          chmod 600 "$RUNNER_TEMP/oci_deploy_key"

      - name: Define SSH options
        run: |
          echo 'SSH_OPTS=-o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes -o StrictHostKeyChecking=yes' >> "$GITHUB_ENV"

      - name: Trust Oracle host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.OCI_PORT || 22 }}" -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote frontend directory
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_PORT: ${{ secrets.OCI_PORT || 22 }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          ssh $SSH_OPTS -i "$RUNNER_TEMP/oci_deploy_key" -p "$OCI_PORT" "$OCI_USERNAME@$OCI_HOST" "mkdir -p /opt/site-anuncios/face-site-anuncios"

      - name: Sync built frontend to Oracle VM
        run: |
          rsync -az --delete \
            -e "ssh $SSH_OPTS -i $RUNNER_TEMP/oci_deploy_key -p ${{ secrets.OCI_PORT || 22 }}" \
            ./dist/ "${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:/opt/site-anuncios/face-site-anuncios/dist/"
          rsync -az Dockerfile nginx.conf .dockerignore \
            -e "ssh $SSH_OPTS -i $RUNNER_TEMP/oci_deploy_key -p ${{ secrets.OCI_PORT || 22 }}" \
            "${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:/opt/site-anuncios/face-site-anuncios/"

      - name: Deploy frontend stack on Oracle VM
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_PORT: ${{ secrets.OCI_PORT || 22 }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          timeout 12m ssh $SSH_OPTS -i "$RUNNER_TEMP/oci_deploy_key" -p "$OCI_PORT" "$OCI_USERNAME@$OCI_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          exec 200>/tmp/site-anuncios-deploy.lock

          echo "Waiting up to 90 seconds for the deployment lock..."
          if ! flock --timeout 90 200; then
            echo "Deployment lock is still held by another process; aborting instead of waiting indefinitely." >&2
            echo "Processes currently holding the deployment lock:" >&2
            if command -v lslocks >/dev/null 2>&1; then
              lock_pids="$(lslocks --noheadings --raw --output PID,PATH | awk '$2 == "/tmp/site-anuncios-deploy.lock" { print $1 }')"
              if [ -n "$lock_pids" ]; then
                while IFS= read -r pid; do
                  ps -ww -o pid,ppid,etime,stat,args -p "$pid" >&2 || true
                  ps -ww --ppid "$pid" -o pid,ppid,etime,stat,args >&2 || true
                done <<< "$lock_pids"
              else
                echo "lslocks did not report a lock owner." >&2
              fi
            else
              echo "lslocks is not installed; cannot identify the lock owner." >&2
            fi
            exit 1
          fi

          cd /opt/site-anuncios/site-anuncios-java
          compose_file=docker-compose.oracle.external-db.yml

          echo "Building the static frontend image..."
          docker compose -f "$compose_file" build --progress plain frontend

          echo "Restarting the frontend container..."
          docker compose -f "$compose_file" up -d --no-build --no-deps frontend

          echo "Frontend deployment status:"
          docker compose -f "$compose_file" ps frontend
          REMOTE
