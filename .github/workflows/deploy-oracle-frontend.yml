name: Deploy Frontend to Oracle VM

on:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-oracle-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare SSH key
        run: |
          printf '%s\n' "${{ secrets.OCI_SSH_KEY }}" > "$RUNNER_TEMP/oci_deploy_key"
          chmod 600 "$RUNNER_TEMP/oci_deploy_key"

      - name: Define SSH options
        run: |
          echo 'SSH_OPTS=-o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes -o StrictHostKeyChecking=yes' >> "$GITHUB_ENV"

      - name: Trust Oracle host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.OCI_PORT || 22 }}" -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote frontend directory
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_PORT: ${{ secrets.OCI_PORT || 22 }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          ssh $SSH_OPTS -i "$RUNNER_TEMP/oci_deploy_key" -p "$OCI_PORT" "$OCI_USERNAME@$OCI_HOST" "mkdir -p /opt/site-anuncios/face-site-anuncios"

      - name: Sync frontend source to Oracle VM
        run: |
          rsync -az --delete --exclude '.git' --exclude 'node_modules' --exclude 'dist' \
            -e "ssh $SSH_OPTS -i $RUNNER_TEMP/oci_deploy_key -p ${{ secrets.OCI_PORT || 22 }}" \
            ./ "${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:/opt/site-anuncios/face-site-anuncios/"

      - name: Deploy frontend stack on Oracle VM
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_PORT: ${{ secrets.OCI_PORT || 22 }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          ssh $SSH_OPTS -i "$RUNNER_TEMP/oci_deploy_key" -p "$OCI_PORT" "$OCI_USERNAME@$OCI_HOST" \
            "exec 200>/tmp/site-anuncios-deploy.lock && flock 200 && cd /opt/site-anuncios/site-anuncios-java && docker compose -f docker-compose.oracle.yml up -d --build frontend && docker compose -f docker-compose.oracle.yml ps"
